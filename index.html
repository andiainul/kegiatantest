<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Kegiatan - KPU Kabupaten Buton Selatan</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --kpu-red: #9e1c1c;
      --kpu-red-hover: #7d1414;
      --kpu-dark: #1e293b;
      --kpu-gold: #d97706;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--kpu-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .portal-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      max-width: 580px;
      width: 100%;
      overflow: hidden;
    }

    .portal-header {
      padding: 2rem 2rem 1.5rem 2rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background: var(--kpu-red);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(158, 28, 28, 0.25);
    }

    .series-badge {
      background-color: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 50rem;
      border: 1px solid #fde68a;
    }

    .main-event-box {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      margin: 1.5rem 2rem;
      padding: 1.75rem;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }

    .category-tag {
      color: var(--kpu-gold);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.5rem;
    }

    .status-alert {
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      margin: 0 2rem 1.5rem 2rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .links-container {
      padding: 0 2rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      color: var(--kpu-dark);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background-color: var(--kpu-red);
      color: #ffffff;
      border-color: var(--kpu-red);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(158, 28, 28, 0.15);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-wrapper {
      width: 36px;
      height: 36px;
      background-color: #f8fafc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--kpu-red);
      transition: all 0.25s ease;
    }

    .action-btn:hover .icon-wrapper {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .arrow-icon {
      opacity: 0.4;
      transition: all 0.25s ease;
    }

    .action-btn:hover .arrow-icon {
      opacity: 1;
      transform: translateX(4px);
    }

    .portal-footer {
      background-color: #f8fafc;
      padding: 1.25rem 2rem;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 0.875rem;
    }

    .fix-link {
      color: var(--kpu-red);
      font-weight: 700;
      text-decoration: none;
    }

    /* Class untuk tombol yang dinonaktifkan jika link belum ada */
    .action-btn.disabled {
      opacity: 0.5;
      pointer-events: none;
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <header class="portal-header d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-logo">
          <i data-lucide="vote" style="width: 24px; height: 24px;"></i>
        </div>
        <div>
          <p class="text-muted mb-0 fw-semibold" style="font-size: 0.8rem;">KPU KABUPATEN BUTON SELATAN</p>
          <h1 class="h5 mb-0 fw-bold">Portal Kegiatan</h1>
        </div>
      </div>
      <span class="series-badge" id="badge-series">Bedah Buku · Seri 2</span>
    </header>

    <section class="main-event-box">
      <span class="category-tag" id="event-category">Bedah Buku</span>
      <h2 class="h4 fw-bold mb-3" id="event-title">Teknik Alokasi Suara<br>Menjadi Kursi di Parlemen</h2>
      <div class="d-flex align-items-center gap-2 text-white-50 fs-7">
        <i data-lucide="calendar" style="width: 16px; height: 16px; color: var(--kpu-gold);"></i>
        <span id="event-date">Rabu, 21 Oktober 2026 &nbsp;·&nbsp; 09.00 WITA</span>
      </div>
    </section>

    <div class="status-alert">
      <span class="status-pulse"></span>
      <span id="status-text">Kegiatan sudah dimulai — selamat bergabung!</span>
    </div>

    <!-- Container tombol tautan -->
    <nav class="links-container" id="links-wrapper">
      <!-- Tombol di-generate otomatis via JS -->
    </nav>

    <footer class="portal-footer">
      <span class="text-muted">Ada kesalahan penulisan nama di sertifikat?</span><br class="d-sm-none">
      <a href="#" id="link-perbaikan" target="_blank" class="fix-link ms-sm-1">Perbaiki data sertifikat &rarr;</a>
    </footer>
  </div>

  <script>
    // =========================================================
    // CONFIGURASI TAUTAN & INFORMASI ACARA (Ubah di sini)
    // =========================================================
    const EVENT_CONFIG = {
      badge: "Bedah Buku · Seri 2",
      category: "BEDAH BUKU",
      title: "Teknik Alokasi Suara<br>Menjadi Kursi di Parlemen",
      date: "Rabu, 21 Oktober 2026 · 09.00 WITA",
      status: "Kegiatan sudah dimulai — selamat bergabung!",
      
      // Daftar Link Direct
      links: [
        { label: "DAFTAR HADIR", icon: "pen-tool", url: "https://forms.google.com/example-presensi" },
        { label: "LINK ZOOM", icon: "video", url: "https://zoom.us/j/example-zoom-id" },
        { label: "BACKGROUND ZOOM", icon: "image", url: "https://drive.google.com/example-bg" },
        { label: "MATERI", icon: "file-text", url: "https://drive.google.com/example-materi" },
        { label: "SERTIFIKAT", icon: "award", url: "https://drive.google.com/example-sertifikat" }
      ],
      
      linkPerbaikan: "https://forms.google.com/example-perbaikan-nama"
    };

    // =========================================================
    // LOGIK RENDERING OTOMATIS
    // =========================================================
    function renderPortal() {
      // 1. Set Info Acara
      document.getElementById('badge-series').innerText = EVENT_CONFIG.badge;
      document.getElementById('event-category').innerText = EVENT_CONFIG.category;
      document.getElementById('event-title').innerHTML = EVENT_CONFIG.title;
      document.getElementById('event-date').innerHTML = EVENT_CONFIG.date;
      document.getElementById('status-text').innerText = EVENT_CONFIG.status;
      document.getElementById('link-perbaikan').href = EVENT_CONFIG.linkPerbaikan;

      // 2. Render Tombol-Tombol Link
      const wrapper = document.getElementById('links-wrapper');
      wrapper.innerHTML = ''; // bersihkan kontainer

      EVENT_CONFIG.links.forEach(item => {
        const hasUrl = item.url && item.url.trim() !== "" && item.url !== "#";
        const btn = document.createElement('a');
        btn.className = `action-btn ${hasUrl ? '' : 'disabled'}`;
        btn.href = hasUrl ? item.url : '#';
        btn.target = "_blank";
        
        btn.innerHTML = `
          <div class="btn-left">
            <div class="icon-wrapper"><i data-lucide="${item.icon}" style="width: 18px; height: 18px;"></i></div>
            <span>${item.label}</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon" style="width: 18px; height: 18px;"></i>
        `;
        wrapper.appendChild(btn);
      });

      // Render ulang ikon Lucide
      lucide.createIcons();
    }

    // Jalankan saat dokumen siap
    document.addEventListener("DOMContentLoaded", renderPortal);
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
